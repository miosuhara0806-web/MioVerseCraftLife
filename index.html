<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#496b53">
  <title>MioVerse 小径の工房</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="workshop-theme.css?v=story-milestone4-1">
  <script src="game.js?v=story-milestone4-1" defer></script>
  <script src="app.js?v=story-milestone4-1" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header"><a href="#home" class="brand">MioVerse <span>小径の工房</span></a><span class="prototype">PROTOTYPE 01</span></header>
    <div class="layout">
      <aside class="sidebar"><p class="eyebrow">森のそば、小さな暮らし。</p><nav aria-label="メインメニュー" id="navigation"></nav><div class="sidebar-note">ひとつずつ、好きなペースで。<br>採集は1日<span id="gather-limit-note">3</span>回。加工・納品は何度でも。<br>依頼に期限はありません。</div><p id="save-status" class="save-status"></p></aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <footer>MIOverse · GATHER, CRAFT & GIVE <span>採集と生産の生活ゲーム / 試作版</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="rest-dialog" aria-labelledby="rest-title" aria-describedby="rest-description">
    <h2 id="rest-title">今日はここまでにしますか？</h2>
    <p id="rest-description">翌日になり、採集回数が3回に戻ります。残り回数は持ち越されません。依頼に期限はありません。</p>
    <div class="rest-actions"><button data-action="rest-cancel" autofocus>まだ作業する</button><button data-action="rest-confirm">休んで次の日へ</button></div>
  </dialog>
  <dialog id="recipe-dialog" aria-labelledby="recipe-dialog-title">
    <div id="recipe-dialog-content"></div>
    <div class="recipe-dialog-actions"><button class="secondary" data-action="recipe-close" autofocus>閉じる</button><button data-action="recipe-go-craft">加工画面で作る</button></div>
  </dialog>
  <dialog id="thank-you-dialog" aria-labelledby="thank-you-title">
    <div id="thank-you-dialog-content"></div>
    <div class="thank-you-actions"><button class="secondary" data-action="thank-you-close">あとで読む</button><button data-action="thank-you-complete">ありがとう</button></div>
  </dialog>
  <dialog id="story-dialog" aria-labelledby="story-dialog-title">
    <div id="story-dialog-content"></div>
    <div class="story-dialog-actions"><button class="secondary" data-action="story-close">あとで読む</button><button data-action="story-complete">工房へ戻る</button></div>
  </dialog>
</body>
</html>
